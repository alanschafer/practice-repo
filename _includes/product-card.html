{% assign p = include.product %}
<article class="pcard reveal" data-category="{{ p.category }}" style="--d: {{ include.delay | default: 0 }}ms">
  <a class="pcard-img" href="{{ p.url | relative_url }}">
    <img src="{{ p.image | relative_url }}" alt="{{ p.title }}" loading="lazy" width="900" height="1125">
    {% if p.badge %}<span class="badge">{{ p.badge }}</span>{% endif %}
  </a>
  <div class="pcard-body">
    <span class="meta">{{ p.category }}</span>
    <h3><a href="{{ p.url | relative_url }}">{{ p.title }}</a></h3>
    <div class="pcard-foot">
      <span class="price">${{ p.price }}</span>
      <button class="add-btn" type="button" data-add data-id="{{ p.slug }}" data-title="{{ p.title | escape }}" data-price="{{ p.price }}" data-img="{{ p.image | relative_url }}" aria-label="Add {{ p.title | escape }} to basket">
        <span>Add</span><b aria-hidden="true">+</b>
      </button>
    </div>
  </div>
</article>
