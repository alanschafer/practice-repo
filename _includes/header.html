<div class="progress" aria-hidden="true"><span></span></div>
<header class="nav">
  <a class="brand" href="{{ '/' | relative_url }}">
    {% include logo.html %}
    <span>{{ site.title }}</span>
  </a>
  <nav aria-label="Main">
    {% assign here = page.url %}
    <a href="{{ '/' | relative_url }}" {% if here == '/' %}aria-current="page"{% endif %}>Home</a>
    <a href="{{ '/blog/' | relative_url }}" {% if here contains '/blog/' %}aria-current="page"{% endif %}>Journal</a>
    <a href="{{ '/about/' | relative_url }}" {% if here == '/about/' %}aria-current="page"{% endif %}>About</a>
    <button class="theme-toggle" type="button" aria-label="Toggle light and dark mode">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
        <path class="moon" d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5Z"/>
        <g class="sun"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></g>
      </svg>
    </button>
  </nav>
</header>
