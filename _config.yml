title: Practice Repo
tagline: "A small studio for big experiments."
description: "A beautifully over-engineered Jekyll site for practicing Git, GitHub, and the craft of the web."
baseurl: "/practice-repo"
url: "https://alanschafer.github.io"
github_username: alanschafer
lang: en

permalink: /blog/:year/:month/:title/
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  syntax_highlighter: rouge

plugins:
  - jekyll-feed
  - jekyll-seo-tag

sass:
  style: compressed

exclude:
  - hello.py
  - notes.md
  - Gemfile
  - Gemfile.lock
  - README.md

defaults:
  - scope: { path: "", type: posts }
    values: { layout: post }
