title: "Shay's Hearth"
tagline: "Small-batch goods for a warmer home."
description: "Handmade soaps, candles, and home goods inspired by the old-world hearth, made in small batches for slow evenings and warm kitchens."
baseurl: "/practice-repo"
url: "https://alanschafer.github.io"
github_username: alanschafer
lang: en

permalink: /journal/:year/:month/:title/
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM

collections:
  products:
    output: true
    permalink: /shop/:name/

plugins:
  - jekyll-feed
  - jekyll-seo-tag

sass:
  style: compressed

exclude:
  - hello.py
  - notes.md
  - Gemfile
  - Gemfile.lock
  - README.md

defaults:
  - scope: { path: "", type: posts }
    values: { layout: post }
  - scope: { path: "", type: products }
    values: { layout: product }
